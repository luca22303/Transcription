[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-transcriber"
version = "0.1.0"
description = "Live lecture transcription running locally with Whisper. No time limit, no cloud."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pywebview>=5.0; sys_platform == 'darwin'",
]

[project.scripts]
vorlesung = "lecture_transcriber.cli:main"

[tool.setuptools]
packages = ["lecture_transcriber"]

[tool.setuptools.package-data]
lecture_transcriber = ["ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
